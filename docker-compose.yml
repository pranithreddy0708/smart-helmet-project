version: '3.8'

services:
  smart-helmet-live-server:
    build: .
    container_name: smart_helmet_live_server
    ports:
      - "5050:5050"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
